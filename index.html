<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사도 요격</title>
<style>
:root{--bg:#120f26;--pn:#1b1740;--ln:#352f6b;--fg:#e8e6ff;--mut:#8f8bc0;--sen:#ff8a9b;--gui:#6fe3d0;--sado:#c9b8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 20px}
h1{font-size:22px;margin:0 0 20px}h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:16px;margin-bottom:14px}
input,select,button{font:inherit;padding:9px 12px;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:3px}
:focus-visible{outline:2px solid var(--gui);outline-offset:1px}
button{cursor:pointer}button:hover:not(:disabled){background:var(--ln)}button:disabled{opacity:.35;cursor:default}
button[aria-pressed=true]{border-color:var(--gui);background:var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}
.bar{height:12px;background:var(--bg);border:1px solid var(--ln);margin:3px 0 12px}.bar i{display:block;height:100%;transition:width .5s}
#game{display:none;grid-template-columns:320px 1fr;gap:14px}
.box{overflow:auto;padding-right:6px}.box div{margin-bottom:4px;word-break:break-word}
#log{height:200px}#radio{height:230px}
.s0{color:var(--sen);font-weight:700}.s1{color:var(--gui);font-weight:700}
#acts button{flex:1;padding:14px 6px}
@media(max-width:760px){#game{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body><main>
<h1>사도 요격</h1>
<section id="home" class="pn">
  <div class="row"><input id="name" placeholder="이름" size="12"><input id="age" placeholder="나이" size="5">
    <label>내 등급 <select id="grade"><option>S</option><option>A</option><option selected>B</option><option>C</option></select></label></div>
  <p class="mut">방을 만든 사람은 센티넬, 코드로 들어온 사람은 가이드가 됩니다. 방을 만든 사람이 창을 닫으면 방이 사라져요.</p>
  <div class="row"><label>사도 등급 <select id="sg"><option>S</option><option>A</option><option selected>B</option><option>C</option></select></label><button id="new">방 만들기</button></div>
  <div class="row" style="margin-top:10px"><input id="code" placeholder="받은 코드" size="8"><button id="join">입장하기</button></div>
  <p id="err" style="color:var(--sen)"></p>
</section>
<section id="game">
  <div>
    <div class="pn">
      <div>사도 <span id="sdg"></span> <span id="sd"></span></div><div class="bar"><i id="sdb" style="background:var(--sado)"></i></div>
      <div>센티넬 HP <span id="hp"></span></div><div class="bar"><i id="hpb" style="background:var(--sen)"></i></div>
      <div>가이드 HP <span id="gp"></span></div><div class="bar"><i id="gpb" style="background:var(--gui)"></i></div>
      <div>동조율 <span id="sy"></span></div><div class="bar"><i id="syb" style="background:#f3d36b"></i></div>
      <div>접촉 단계 <b id="ct"></b></div>
      <div id="info" class="mut" style="margin-top:8px"></div>
    </div>
    <div class="pn">
      <div id="rd" style="margin-bottom:8px"></div>
      <div class="row" id="acts"><button data-a="attack">공격</button><button data-a="guard">방어</button><button data-a="guide">가이딩</button></div>
      <p id="st" class="mut"></p>
      <p class="mut" style="font-size:13px">가이딩은 두 사람이 같은 턴에 함께 골라야 성공해요. 무전기로 맞춰보세요.</p>
      <button id="again" hidden>다시 도전</button>
    </div>
  </div>
  <div>
    <div class="pn"><h2>전투 기록</h2><div id="log" class="box mut"></div></div>
    <div class="pn"><h2>무전기</h2><div id="radio" class="box"></div>
      <div class="row" style="margin-top:8px"><input id="msg" maxlength="100" style="flex:1" placeholder="최대 100자, Enter로 전송"><span id="cnt" class="mut">0/100</span></div></div>
  </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const rnd=n=>1+Math.floor(Math.random()*n);
const grade=g=>['S','A','B','C'].includes(g)?g:'B';
// ===== 등급별 능력치: 숫자를 고치면 밸런스가 바뀝니다 =====
const SEN={S:{hp:80,atk:10},A:{hp:70,atk:8},B:{hp:60,atk:6},C:{hp:50,atk:4}};
const GUI={S:{hp:60,up:24,guard:.7},A:{hp:55,up:20,guard:.55},B:{hp:50,up:16,guard:.4},C:{hp:45,up:12,guard:.25}};
const SADO={S:{hp:150,atk:9},A:{hp:120,atk:7},B:{hp:90,atk:5},C:{hp:70,atk:4}};
const CONTACT=['없음','손 잡기','포옹','깊은 접촉'];
const SADO_HIT_GUIDE=0.2;
// ===========================================================
let isHost=false,me=-1,code='',peer=null,hostConn=null,guestConn=null,r=null;
const prof=()=>({name:$('name').value.trim().slice(0,20)||'이름 없음',age:$('age').value.slice(0,10),grade:grade($('grade').value)});
$('code').value=new URLSearchParams(location.search).get('code')||'';
const fail=t=>$('err').textContent=t;
if(typeof Peer==='undefined')fail('연결 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침하세요.');

// ---------- 방장(센티넬) 쪽: 게임 규칙을 처리 ----------
const sendTo=(i,o)=>{if(i===0)recv(o);else if(guestConn&&guestConn.open)guestConn.send(o)};
const all=o=>[0,1].forEach(i=>r.p[i]&&sendTo(i,o));
const log=t=>all({t:'log',text:t});
function init(){
  const [s,g]=r.p;
  Object.assign(r,{smax:SADO[r.sg].hp,hpmax:SEN[s.grade].hp,sync:50,contact:0,round:1,over:null});
  r.sadu=r.smax;r.hp=r.hpmax;
  if(g){r.gmax=GUI[g.grade].hp;r.ghp=r.gmax}
  r.p.forEach(p=>p&&(p.act=null));
}
function state(){r.p.forEach((p,i)=>p&&sendTo(i,{t:'state',me:i,act:p.act,sg:r.sg,sadu:r.sadu,smax:r.smax,hp:r.hp,hpmax:r.hpmax,ghp:r.ghp,gmax:r.gmax,
  sync:r.sync,contact:r.contact,contactName:CONTACT[r.contact],round:r.round,over:r.over,
  p:r.p.map(x=>x&&{name:x.name,age:x.age,grade:x.grade,chose:!!x.act})}))}
function resolve(){
  const [s,g]=r.p,L=[];
  const both=s.act==='guide'&&g.act==='guide';
  const guard=g.act==='guard'?GUI[g.grade].guard:0;
  if(s.act==='attack'){const d=Math.round((SEN[s.grade].atk+rnd(8))*(0.5+r.sync/100));r.sadu-=d;L.push(`⚔ ${s.name}의 공격 — 사도에게 ${d} 피해`)}
  else if(!both)L.push(`… ${s.name}이(가) 가이딩을 시도했지만 호흡이 맞지 않았다.`);
  if(g.act==='guard')L.push(`🛡 ${g.name}의 방어 — 받는 피해 ${Math.round(guard*100)}% 경감`);
  else if(!both)L.push(`… ${g.name}이(가) 가이딩을 시도했지만 호흡이 맞지 않았다.`);
  if(both){
    const up=GUI[g.grade].up+r.contact*4,h=Math.round(up/3);
    r.sync=Math.min(100,r.sync+up);r.hp=Math.min(r.hpmax,r.hp+h);r.ghp=Math.min(r.gmax,r.ghp+h);
    L.push(`✦ 가이딩 성공 (접촉: ${CONTACT[r.contact]}) — 동조율 +${up}, 두 사람 HP +${h}`);
    if(r.contact<3){r.contact++;L.push(`접촉 단계가 올랐다: ${CONTACT[r.contact]}`)}
  }
  if(r.sadu>0){
    const toG=Math.random()<SADO_HIT_GUIDE;
    const d=Math.max(1,Math.round((SADO[r.sg].atk+rnd(6))*(r.sync<30?1.5:1)*(1-guard)));
    if(toG)r.ghp-=d;else r.hp-=d;
    r.sync=Math.max(0,r.sync-8);
    L.push(`☠ 사도의 공격 — ${toG?'가이드':'센티넬'}에게 ${d} 피해, 동조율 -8`);
  }
  r.sadu=Math.max(0,r.sadu);r.hp=Math.max(0,r.hp);r.ghp=Math.max(0,r.ghp);
  if(r.sadu===0){r.over='win';L.push('사도가 침묵했다.')}
  else if(r.hp===0||r.ghp===0){r.over='lose';L.push(`${r.hp===0?'센티넬':'가이드'}이(가) 쓰러졌다…`)}
  else r.round++;
  s.act=g.act=null;L.forEach(log);
}
function handle(i,m){
  if(!r)return;
  if(m.t==='radio'){const text=Array.from(String(m.text||'')).slice(0,100).join('').trim();if(text&&r.p[i])all({t:'radio',from:r.p[i].name,role:i,text})}
  else if(m.t==='act'&&r.p[1]&&!r.over&&(i===0?['attack','guide']:['guard','guide']).includes(m.a)){
    r.p[i].act=m.a;state();
    if(r.p[0].act&&r.p[1].act){resolve();state()}
  }else if(m.t==='reset'&&r.over){init();log('— 새 작전 개시 —');state()}
}
function openRoom(p){
  code=Math.random().toString(36).slice(2,6).toUpperCase();
  peer=new Peer('sadogame-'+code);
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();openRoom(p)}else fail('연결 서버 오류: '+e.type)});
  peer.on('open',()=>{
    isHost=true;me=0;r={sg:grade($('sg').value),p:[{...p,act:null},null]};init();
    recv({t:'joined',code});log(`방이 열렸다. 사도 등급: ${r.sg}. 상대를 기다리는 중…`);state();
  });
  peer.on('connection',c=>{
    if(guestConn){c.on('open',()=>{c.send({t:'err',text:'이미 가득 찬 방입니다.'});setTimeout(()=>c.close(),300)});return}
    guestConn=c;
    c.on('data',m=>{
      if(m.t==='join'&&!r.p[1]){
        r.p[1]={name:String(m.name||'이름 없음').slice(0,20),age:String(m.age||'').slice(0,10),grade:grade(m.grade),act:null};
        init();c.send({t:'joined',code});log(`${r.p[1].name}이(가) 가이드로 합류했다. 사도가 다가온다.`);state();
      }else handle(1,m);
    });
    c.on('close',()=>{alert('상대와 연결이 끊어졌습니다.');location.href=location.pathname});
  });
}
// ---------- 가이드 쪽 ----------
function joinRoom(p){
  code=$('code').value.trim().toUpperCase();
  if(!code)return fail('코드를 입력하세요.');
  peer=new Peer();
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'없는 코드입니다. 방장이 방을 열어둔 상태인지 확인하세요.':'연결 오류: '+e.type));
  peer.on('open',()=>{
    me=1;hostConn=peer.connect('sadogame-'+code,{reliable:true});
    hostConn.on('open',()=>hostConn.send({t:'join',...p}));
    hostConn.on('data',recv);
    hostConn.on('close',()=>{alert('상대와 연결이 끊어졌습니다.');location.href=location.pathname});
  });
}
// ---------- 공통: 화면 ----------
const tx=m=>isHost?handle(0,m):hostConn&&hostConn.open&&hostConn.send(m);
$('new').onclick=()=>{fail('');openRoom(prof())};
$('join').onclick=()=>{fail('');joinRoom(prof())};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>tx({t:'act',a:b.dataset.a}));
$('again').onclick=()=>tx({t:'reset'});
$('msg').oninput=e=>$('cnt').textContent=Array.from(e.target.value).length+'/100';
$('msg').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){tx({t:'radio',text:e.target.value});e.target.value='';$('cnt').textContent='0/100'}};
const put=(box,...nodes)=>{const d=document.createElement('div');d.append(...nodes);$(box).append(d);$(box).scrollTop=1e9};
const NAME={attack:'공격',guard:'방어',guide:'가이딩'};
function render(m){
  const role=m.me===0?'센티넬':'가이드';
  const bar=(t,b,v,max,suf)=>{$(t).textContent=suf?v+suf:v+' / '+max;$(b).style.width=(max?v/max*100:v)+'%'};
  bar('sd','sdb',m.sadu,m.smax);$('sdg').textContent='['+m.sg+']';
  bar('hp','hpb',m.hp,m.hpmax);bar('gp','gpb',m.p[1]?m.ghp:0,m.gmax||1);
  bar('sy','syb',m.sync,0,'%');$('ct').textContent=m.contactName;
  $('info').innerHTML='';
  [['센티넬',m.p[0]],['가이드',m.p[1]]].forEach(([n,p])=>{const d=document.createElement('div');d.textContent=p?`${p.name}${p.age?' ('+p.age+')':''} [${p.grade}] · ${n}`:'가이드 대기 중';$('info').append(d)});
  const link=document.createElement('div');link.textContent='초대 링크: '+location.origin+location.pathname+'?code='+code;$('info').append(link);
  $('rd').textContent=`${m.round}라운드 · 당신은 ${role}`;
  const ok=m.me===0?['attack','guide']:['guard','guide'];
  document.querySelectorAll('[data-a]').forEach(b=>{b.hidden=!ok.includes(b.dataset.a);b.disabled=!m.p[1]||!!m.over;b.setAttribute('aria-pressed',m.act===b.dataset.a)});
  $('st').textContent=m.over?(m.over==='win'?'사도를 쓰러뜨렸다!':'작전 실패…'):!m.p[1]?'상대를 기다리는 중…':m.act?`${NAME[m.act]} 선택함. 상대를 기다리는 중… (다시 눌러 바꿀 수 있어요)`:'행동을 선택하세요.';
  $('again').hidden=!m.over;
}
function recv(m){
  if(m.t==='err')fail(m.text);
  else if(m.t==='joined'){code=m.code;$('home').style.display='none';$('game').style.display='grid'}
  else if(m.t==='log')put('log',m.text);
  else if(m.t==='radio'){const b=document.createElement('span');b.className='s'+m.role;b.textContent=m.from+'  ';put('radio',b,m.text)}
  else if(m.t==='state')render(m);
}
</script></body></html>
